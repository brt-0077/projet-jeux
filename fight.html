<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Combat</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="has-hud theme-neonwave" data-page="fight">
<header class="hud" aria-label="HUD joueur">
	<div class="hud-pill">
		<p class="hud-label">Nom</p>
		<p class="hud-value" id="hud-name">-</p>
	</div>
	<div class="hud-pill">
		<p class="hud-label">HP</p>
		<p class="hud-value" id="hud-hp">-</p>
	</div>
	<div class="hud-pill">
		<p class="hud-label">Mana</p>
		<p class="hud-value" id="hud-mana">-</p>
	</div>
	<div class="hud-pill">
		<p class="hud-label">Or</p>
		<p class="hud-value" id="hud-gold">-</p>
	</div>
</header>
<main class="panel combat-shell">
	<header class="panel-header">
		<h1>⚔️ Combat</h1>
		<p class="subtitle">Duel en temps reel narratif</p>
	</header>

	<section class="arena-2d" aria-label="Carte de combat 2D">
		<div class="arena-meta">
			<p class="arena-name" id="arena-name">Arene 1</p>
			<p class="arena-difficulty" id="arena-difficulty">Difficulte 1/6</p>
		</div>
		<div class="arena-horizon"></div>
		<div class="arena-grid"></div>
		<div class="fighter player-fighter">
			<div class="fighter-hp-container">
				<div class="fighter-hp-bar">
					<div class="fighter-hp-fill" id="player-arena-hp-bar" style="--value: 100%;"></div>
				</div>
				<p class="fighter-hp-text" id="player-hp-text-arena">-</p>
			</div>
			<div class="fighter-shadow"></div>
			<div class="fighter-sprite" id="player-sprite">🧙</div>
			<p class="fighter-name" id="player-name-fight">-</p>
		</div>
		<div class="fighter enemy-fighter" id="enemy-fighter">
			<div class="fighter-hp-container">
				<div class="fighter-hp-bar">
					<div class="fighter-hp-fill" id="monster-arena-hp-bar" style="--value: 100%;"></div>
				</div>
				<p class="fighter-hp-text" id="monster-hp-text-arena">-</p>
			</div>
			<div class="fighter-shadow"></div>
			<div class="fighter-sprite" id="enemy-sprite">👹</div>
			<p class="fighter-name" id="monster-name-fight">-</p>
		</div>
	</section>


	<section class="action-row">
		<button class="btn-primary" id="attack-btn">Attaque</button>
		<button class="btn-secondary" id="fireball-btn">🔥 Boule de feu</button>
		<button class="btn-secondary" id="magic-btn">✨ Pouvoir magique</button>
		<button class="btn-secondary" id="grenade-btn">💣 Grenade</button>
		<button class="btn-danger" id="restart-btn" hidden>Recommencer</button>
	</section>

	<a class="back-link" href="index.html">⬅ Retour</a>
</main>
<script src="app.js"></script>
</body>
</html>
